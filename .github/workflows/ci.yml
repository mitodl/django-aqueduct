name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install prek
        run: pip install prek
      - name: Run prek
        run: prek run --all-files

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run mypy
        run: uv run mypy src/django_aqueduct

  test:
    name: "Test / Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.x"]
        exclude:
          # Django 4.2 supports Python 3.8–3.12 only.
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.14"
            django-version: "4.2"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Override Django version
        run: |
          if [ "${{ matrix.django-version }}" = "6.x" ]; then
            uv pip install "django>=6.0,<7.0"
          else
            uv pip install "django~=${{ matrix.django-version }}.0"
          fi

      - name: Run tests
        run: uv run pytest tests/ --tb=short -q

  # Requiring `ci-gate` keeps the list of what must pass in the same file as the jobs it
  # names. `needs` on a matrix job aggregates every shard, so no shard count appears
  # anywhere.
  ci-gate:
    needs: [lint, typecheck, test]
    # Without this the gate is skipped when a dependency fails, and GitHub treats a
    # skipped required job as successful, allowing the PR to merge despite the failure.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate CI result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Read from `needs` rather than naming each job again: adding a job to the list
          # above is then the only edit, which is the entire point of this job. `skipped`
          # passes so that a job legitimately gated behind an `if:` does not wedge the
          # branch; `failure` and `cancelled` do not.
          failed=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::CI did not succeed: $(echo "$failed" | paste -sd, -)"
            exit 1
          fi
          echo "All CI jobs succeeded."

[project]
name = "django-aqueduct"
version = "0.10.0"
description = "Structured, typed, auditable Django settings management powered by Pydantic"
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "MIT Open Learning Engineering", email = "odl-devops@mit.edu" },
]
keywords = [
  "django",
  "settings",
  "pydantic",
  "configuration",
  "kubernetes",
  "vault",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["django>=4.2", "pydantic>=2.0", "pydantic-settings>=2.7"]

[project.optional-dependencies]
codegen = ["genson>=1.2.1,<2"]
vault = ["hvac>=2.0"]
aws = ["boto3>=1.26"]
mitol = ["mitol-django-common>=2023.1.1"]
derivations = ["dj-database-url>=2.0"]
yaml = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/mitodl/django-aqueduct"
Repository = "https://github.com/mitodl/django-aqueduct"
Issues = "https://github.com/mitodl/django-aqueduct/issues"

[tool.uv]
exclude-newer = "7d"
required-version = ">=0.9.17"

[tool.uv.exclude-newer-package]
ol-concourse = "0d"
django-aqueduct = "0d"
edx-sysadmin = "0d"
edx-username-changer = "0d"
ol-openedx-ai-static-translations = "0d"
ol-openedx-auto-select-language = "0d"
ol-openedx-canvas-integration = "0d"
ol-openedx-chat = "0d"
ol-openedx-chat-xblock = "0d"
ol-openedx-checkout-external = "0d"
ol-openedx-course-export = "0d"
ol-openedx-course-outline-api = "0d"
ol-openedx-course-structure-api = "0d"
ol-openedx-course-sync = "0d"
ol-openedx-course-translations = "0d"
ol-openedx-events-handler = "0d"
ol-openedx-feedback = "0d"
ol-openedx-git-auto-export = "0d"
ol-openedx-logging = "0d"
ol-openedx-lti-utilities = "0d"
ol-openedx-otel-monitoring = "0d"
ol-openedx-rapid-response-reports = "0d"
ol-openedx-sentry = "0d"
ol-openedx-uai-content-customization = "0d"
ol-social-auth = "0d"
openedx-companion-auth = "0d"
rapid-response-xblock = "0d"
mitol-django-common = "0d"
mitol-django-mail = "0d"
mitol-django-authentication = "0d"
mitol-django-digitalcredentials = "0d"
mitol-django-geoip = "0d"
mitol-django-google-sheets = "0d"
mitol-django-google-sheets-deferrals = "0d"
mitol-django-google-sheets-refunds = "0d"
mitol-django-hubspot-api = "0d"
mitol-django-oauth-toolkit-extensions = "0d"
mitol-django-olposthog = "0d"
mitol-django-openedx = "0d"
mitol-django-payment-gateway = "0d"
mitol-django-transcoding = "0d"
mitol-django-apigateway = "0d"
mitol-django-observability = "0d"
mitol-django-scim = "0d"
mitol-drf-lint = "0d"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_aqueduct"]

[tool.hatch.build.targets.sdist]
include = ["src/django_aqueduct", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
  "boto3>=1.26",
  "dj-database-url>=2.0",
  "django-stubs[compatible-mypy]>=5.0",
  "genson>=1.2.1,<2",
  "hvac>=2.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pytest-mock>=3.14",
  "pyyaml>=6.0",
  "ruff>=0.4",
  "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "testapp", "."]
DJANGO_SETTINGS_MODULE = "testapp.settings"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B", "C4", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "D"]
"testapp/*" = ["S", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
